<body data-mode="forgot"><main class="login-card"><a href="/admin/login.html" class="back-btn">← Back to sign in</a><h2>Forgot password?</h2><p class="subtitle">Enter your registered email to request a password reset link.</p><div id="notice" class="alert" role="status" aria-live="polite"></div><form id="reset-form"><div class="input-group"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div><button type="submit" class="btn-submit">Send reset link</button></form><noscript>Enable JavaScript to use this form.</noscript></main><script>
const form = document.getElementById('reset-form');
const notice = document.getElementById('notice');
const button = form.querySelector('button[type="submit"]');
const mode = document.body.dataset.mode;
// The backend must implement the endpoints described in README.txt.
let token = '';
if (mode === 'reset') {
    const url = new URL(window.location.href);
    token = new URLSearchParams(url.hash.slice(1)).get('token') || url.searchParams.get('token') || '';
    // Remove the token from the visible URL; keep it only in memory.
    url.searchParams.delete('token');
    url.hash = '';
    history.replaceState(null, '', url.pathname + url.search);
    if (!token) {
        show('This reset link is missing its token. Please request a new link.', false);
        form.hidden = true;
    }
}
function show(message, success) {
    notice.textContent = message;
    notice.className = 'alert ' + (success ? 'success' : 'error');
    notice.style.display = 'block';
}
form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    if (mode === 'reset' && form.elements.password.value !== form.elements.confirmPassword.value) {
        show('Both passwords must match.', false);
        form.elements.confirmPassword.focus();
        return;
    }
    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = 'Please wait…';
    notice.style.display = 'none';
    try {
        // Fetch a session-bound CSRF token. Do not disable CSRF protection.
        const csrfResponse = await fetch('/admin/api/password-reset/csrf', {
            credentials: 'same-origin', cache: 'no-store', redirect: 'error',
            headers: {'Accept': 'application/json'}
        });
        if (!csrfResponse.ok || !(csrfResponse.headers.get('content-type') || '').includes('application/json')) {
            throw new Error('setup');
        }
        const csrf = await csrfResponse.json();
        if (typeof csrf.token !== 'string' || !csrf.token || typeof csrf.headerName !== 'string' || !/^X-[A-Za-z0-9-]+$/i.test(csrf.headerName)) {
            throw new Error('setup');
        }
        const payload = mode === 'forgot'
            ? {email: form.elements.email.value.trim()}
            : {token, password: form.elements.password.value};
        const response = await fetch('/admin/api/password-reset/' + (mode === 'forgot' ? 'request' : 'confirm'), {
            method: 'POST', credentials: 'same-origin', redirect: 'error',
            headers: {'Content-Type': 'application/json', 'Accept': 'application/json', [csrf.headerName]: csrf.token},
            body: JSON.stringify(payload)
        });
        if (response.status === 429) throw new Error('Too many attempts. Please try again later.');
        if (response.status === 403) throw new Error('Your session expired. Refresh the page and try again.');
        if (mode === 'reset' && response.status === 400) throw new Error('The link is invalid or expired, or the password does not meet the requirements.');
        // Require the documented JSON acknowledgement: an HTML fallback is not success.
        if (!response.ok || !(response.headers.get('content-type') || '').includes('application/json')) throw new Error('setup');
        const result = await response.json();
        if (result.status !== (mode === 'forgot' ? 'accepted' : 'reset')) throw new Error('setup');
        if (mode === 'forgot') {
            show('If an eligible account exists for this email, a reset link will be sent. Please check your inbox and spam folder.', true);
            form.reset();
        } else {
            token = '';
            form.reset();
            form.hidden = true;
            show('Your password has been reset. Use Back to sign in with your new password.', true);
        }
    } catch (error) {
        show(error.message === 'setup' ? 'Password reset is unavailable. The server must provide the password-reset API.' :
            error instanceof TypeError ? 'Could not contact the server. Please try again.' : error.message, false);
    } finally {
        button.disabled = false;
        button.textContent = originalLabel;
    }
});
</script></body></html>
