<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="/assets/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mahesh Pai</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .gallery-section { max-width: 1400px; margin: 0 auto 100px; padding: 0 5%; }
        .section-header { margin-bottom: 40px; border-left: 4px solid var(--orange-accent, #FF6B00); padding-left: 20px; }
        .section-header h2 { font-size: 2.5rem; color: var(--text-primary); }
        
        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .video-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; }
        .video-thumbnail { position: relative; height: 220px; background: #000; }
        .video-thumbnail img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 3rem; opacity: 0.8; transition: var(--transition); cursor: pointer; }
        .video-card:hover .play-btn { opacity: 1; color: var(--orange-accent, #FF6B00); transform: translate(-50%, -50%) scale(1.1); }
        .video-info { padding: 20px; }

        /* Testimonials */
        .testimonial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .testimo-card { padding: 30px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; }
        .stars { color: #F59E0B; margin-bottom: 15px; }
    </style>
    <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body>

    <div id="header"></div>
    <div id="navbar"></div>

   <main>
        <section class="page-hero reveal">
            <h1>Media <span class="gradient-text">Gallery</span></h1>
        </section>

        <div style="margin-top: 80px;">
            <!-- Target: Testimonials -->
            <section id="testimonials" class="gallery-section reveal">
                <div class="section-header">
                    <h2>Client Testimonials</h2>
                </div>
                <div class="image-grid" id="testimonials-container"></div>
            </section>

            <!-- Target: Press & Media -->
            <section id="press-media" class="gallery-section reveal">
                <div class="section-header">
                    <h2>Press & Media</h2>
                </div>
                <div class="image-grid" id="press-media-container"></div>
            </section>

            <!-- Target: Video Gallery -->
            <section id="video-gallery" class="gallery-section reveal">
                <div class="section-header">
                    <h2>Video Gallery</h2>
                </div>
                <div class="video-grid" id="video-container"></div>
            </section>

            <!-- Target: Photos -->
            <section id="photos" class="gallery-section reveal">
                <div class="section-header">
                    <h2>Photos</h2>
                </div>
                <div class="masonry-gallery" id="photos-container"></div>
            </section>
        </div>
    </main>

    <dialog id="galleryLightbox" style="border:0;padding:16px;max-width:95vw;max-height:95vh;background:var(--bg-secondary);">
        <button type="button" onclick="closeLightbox()" aria-label="Close photo" style="display:block;margin-left:auto;font-size:24px;cursor:pointer;">&times;</button>
        <img id="lightboxImage" alt="Gallery photo" style="max-width:85vw;max-height:80vh;object-fit:contain;">
    </dialog>
    <div id="footer"></div>

	<script src="/assets/js/common.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        const lightbox = document.getElementById('galleryLightbox');
        const lightboxImg = document.getElementById('lightboxImage');
        function openLightbox(element) {
            lightboxImg.src = element.querySelector('img').src;
            lightbox.showModal();
        }
        function closeLightbox() { lightbox.close(); }

        // Load gallery independently of the header/footer component requests.
        document.addEventListener('DOMContentLoaded', async () => {
            const sections = {
                'Testimonials': 'testimonials-container',
                'Press & Media': 'press-media-container',
                'Video Gallery': 'video-container',
                'Photos': 'photos-container'
            };
            try {
                const response = await fetch('/api/gallery');
                if (!response.ok) throw new Error('Gallery request failed');
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Invalid gallery response');
                for (const [category, containerId] of Object.entries(sections)) {
                    renderGridItems(data.filter(item => (item.category || 'Photos') === category), containerId);
                }
            } catch (error) {
                for (const containerId of Object.values(sections)) {
                    document.getElementById(containerId).textContent = 'Unable to load gallery. Please refresh and try again.';
                }
                console.error(error);
            }
        });

        function renderGridItems(items, containerId) {
            const container = document.getElementById(containerId);
            container.replaceChildren();
            if (items.length === 0) {
                container.textContent = 'No media available.';
                return;
            }
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'image-grid-item glass reveal active';
                if (item.mediaType === 'VIDEO' || item.videoUrl) {
                    try {
                        const url = new URL(item.videoUrl);
                        if (!['https:', 'http:'].includes(url.protocol)) return;
                        const link = document.createElement('a');
                        link.href = url.href;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        card.className = 'video-card reveal active';
                        let videoId = '';
                        if (url.hostname === 'youtu.be') videoId = url.pathname.slice(1);
                        else if (['youtube.com', 'www.youtube.com', 'm.youtube.com'].includes(url.hostname)) {
                            videoId = url.searchParams.get('v') || url.pathname.split('/').pop();
                        }
                        if (/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
                            const thumbnail = document.createElement('img');
                            thumbnail.src = 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
                            thumbnail.alt = item.title || 'Video';
                            thumbnail.style.cssText = 'width:100%;height:220px;object-fit:cover;';
                            link.appendChild(thumbnail);
                        }
                        const caption = document.createElement('div');
                        caption.className = 'video-info';
                        caption.textContent = '▶ ' + (item.title || 'Watch video');
                        link.appendChild(caption);
                        card.appendChild(link);
                    } catch { return; }
                } else if (item.fileUrl) {
                    const img = document.createElement('img');
                    img.src = item.fileUrl;
                    img.alt = item.title || 'Gallery photo';
                    img.loading = 'lazy';
                    img.style.cssText = 'width:100%;height:auto;display:block;cursor:pointer;';
                    img.addEventListener('error', () => {
                        card.textContent = (item.title || 'Photo') + ' — Image file is missing. Please upload it again.';
                    });
                    card.appendChild(img);
                    card.addEventListener('click', () => { if (card.querySelector('img')) openLightbox(card); });
                } else {
                    card.textContent = (item.title || 'Photo') + ' — No image was saved. Please upload it again.';
                }
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
